  bar.innerHTML=`<button data-a="b" class="${m.b?'on':''}">${m.b?'★ Signet posé':'☆ Signet'}</button><button data-a="h" class="${m.h?'on':''}">${m.h?'Surligné':'Surligner'}</button><button data-a="n" class="${m.n?'on':''}">✎ ${m.n?'Modifier la note':'Note'}</button><button data-a="c">❝ Citer</button>`;
  const anchor=blk.tagName==='LI'?blk:blk;anchor.after(bar);
  bar.onclick=ev=>{
    const a=ev.target.closest('button');if(!a)return;ev.stopPropagation();
    const y=scrollY;const act=a.dataset.a;
    if(act==='c'){copy(citeText(strip(c.blocks[i].x),c,c.blocks[i].p),'Citation copiée avec la référence.');return}
    if(act==='n'){
      bar.remove();const ed=document.createElement('div');ed.className='nedit';
      ed.innerHTML=`<textarea aria-label="Ma note" placeholder="Votre réflexion sur ce passage…">${esc(m.n||'')}</textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-s="1">Enregistrer</button><button class="btn sm ghost" data-s="0">Annuler</button>${m.n?'<button class="btn sm ghost" data-s="d">Supprimer la note</button>':''}</div>`;
      blk.after(ed);const ta=$('textarea',ed);ta.focus();
      ed.onclick=ev2=>{const s=ev2.target.closest('[data-s]');if(!s)return;ev2.stopPropagation();
        if(s.dataset.s==='1'){setMark(c,i,{n:ta.value.trim()});toast('Note enregistrée.')}
        else if(s.dataset.s==='d'){setMark(c,i,{n:''});toast('Note supprimée.')}
        if(s.dataset.s!=='0'){vRead();scrollTo({top:y,behavior:'instant'})}else{ed.remove();blk.classList.remove('sel')}};
      return}
    if(act==='b'){setMark(c,i,{b:!m.b});toast(m.b?'Signet retiré.':'Signet posé.')}
    if(act==='h'){setMark(c,i,{h:!m.h});toast(m.h?'Surlignage retiré.':'Passage surligné.')}

  };
}
/* citation d’une sélection */
function selInfo(){
  const sel=getSelection();if(!sel||sel.rangeCount===0||sel.isCollapsed)return null;
  const r=sel.getRangeAt(0),body=$('#body');if(!body||!body.contains(r.commonAncestorContainer))return null;
  const frag=r.cloneContents();$$('.pg,.mk,.bar-act,.nt',frag).forEach(x=>x.remove());
  const txt=frag.textContent.replace(/\s+/g,' ').trim();if(txt.length<6)return null;
  let node=r.startContainer;node=node.nodeType===1?node:node.parentNode;const blk=node.closest('.blk')||node.closest('[data-p]');
  let page=blk?+blk.dataset.p:chOf(curCh).start;
  if(blk){$$('.pg',blk).forEach(pg=>{const rr=document.createRange();rr.selectNode(pg);if(r.compareBoundaryPoints(Range.START_TO_START,rr)>=0)page=+pg.textContent.replace(/\D/g,'')})}
  return {txt,page};
}
function hideCite(){const b=$('#cite');if(b)b.remove()}
document.addEventListener('selectionchange',()=>{
  if(view!=='lire')return;const i=selInfo();
  if(!i){hideCite();return}
  if(!$('#cite')){const b=document.createElement('button');b.id='cite';b.className='btn';b.textContent='❝ Copier la citation';
    b.onmousedown=e=>e.preventDefault();
    b.onclick=()=>{const k=selInfo();if(k){copy(citeText(k.txt,chOf(curCh),k.page),'Citation copiée avec la référence.')}getSelection().removeAllRanges();hideCite()};
    document.body.appendChild(b)}
});

let tick=false,saveT;
function onScroll(){
  if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;
    let t=$('#top');
    if(scrollY>900){if(!t){t=document.createElement('button');t.id='top';t.setAttribute('aria-label','Retour en haut');t.textContent='↑';t.onclick=()=>scrollTo({top:0,behavior:'smooth'});document.body.appendChild(t)}}else if(t)t.remove();

    const top=a.getBoundingClientRect().top+scrollY,h=a.offsetHeight-innerHeight*0.6;

let sCh='';
function vSearch(){
  app.innerHTML=head('Recherche','Chercher dans le livre',`Tapez un ou plusieurs mots : les passages qui les contiennent tous s’affichent, sans tenir compte des accents ni des majuscules.`)+
  `<div class="sbar"><input id="q" type="search" placeholder="Ex. : Kalam, canon, bilirubine, relativisme…" value="${esc(query)}" autocomplete="off" aria-label="Rechercher dans le livre"><select id="qch" aria-label="Limiter à un chapitre"><option value="">Tous les chapitres</option>${readable.map(c=>`<option value="${c.num}" ${String(c.num)===sCh?'selected':''}>${c.num}. ${esc(c.title)}</option>`).join('')}</select></div><div id="rec"></div><div id="rs" aria-live="polite"></div>`;
  const q=$('#q');q.oninput=()=>{query=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{doSearch();remember()},250)};
  $('#qch').onchange=e=>{sCh=e.target.value;doSearch()};
  q.onkeydown=e=>{if(e.key==='Enter')remember()};
  doSearch();if(!query)q.focus();
}
function remember(){const t=query.trim();if(t.length<3)return;S.recent=[t].concat(S.recent.filter(x=>x!==t)).slice(0,6);store.set('recent',S.recent)}
function doSearch(){
  const out=$('#rs'),rec=$('#rec');if(!out)return;
  const raw=query.trim();
  rec.innerHTML=!raw&&S.recent.length?`<div class="count" style="margin-bottom:8px">Recherches récentes :</div>${S.recent.map(r=>`<button class="chip" data-go="recherche" data-q="${esc(r)}">${esc(r)}</button>`).join('')}`:'';
  const terms=fold(raw).split(/\s+/).filter(t=>t.length>1);
  if(!terms.length){out.innerHTML='';return}
  const res=buildIndex().filter(x=>(!sCh||String(x.c.num)===sCh)&&terms.every(t=>x.f.includes(t)));
  if(!res.length){out.innerHTML='<p class="count">Aucun passage trouvé. Essayez un mot plus court ou sans accord (ex. « miracle » plutôt que « miraculeux »).</p>';return}
  const shown=res.slice(0,120);let lastC=null,h=`<p class="count" style="margin:14px 0 0">${res.length} passage${res.length>1?'s':''} trouvé${res.length>1?'s':''}${res.length>120?' (les 120 premiers sont affichés)':''}.</p>`;
  shown.forEach(x=>{
    if(x.c!==lastC){h+=`<h2 class="rgroup">${x.c.num}. ${esc(x.c.title)}</h2>`;lastC=x.c}
    const pos=Math.max(0,x.f.indexOf(terms[0])-110),end=Math.min(x.raw.length,pos+300);
    const sl=x.raw.slice(pos,end),sf=x.f.slice(pos,end);
    h+=`<div class="res"><h3><button data-go="lire" data-ch="${x.c.num}" data-jump="${x.i}">p. ${x.b.p} · ouvrir le passage →</button></h3><p>${pos>0?'… ':''}${hlText(sl,sf,terms)}${end<x.raw.length?' …':''}</p></div>`;
  });
  out.innerHTML=h;
}

function readForm(f){const o={};new FormData(f).forEach((v,k)=>o[k]=String(v).trim());o.ok=f.ok.checked;return o}
function mailBody(o){return `Bonjour Nelson,\n\n${o.message}\n\n— ${o.prenom} ${o.nom}\nE-mail : ${o.email}${o.tel?'\nTéléphone : '+o.tel:''}${o.ville?'\nVille : '+o.ville:''}\nProfil : ${o.role}\nChapitre : ${o.chapitre}${o.page?'\nPassage : '+o.page:''}`}
async function onSubmit(f){
  const o=readForm(f),err={};
  if(!o.prenom)err.prenom='Indiquez votre prénom.';
  if(!o.nom)err.nom='Indiquez votre nom.';

  if(!o.ok)err.ok='Il faut accepter pour envoyer le message.';
  $$('.err',f).forEach(x=>x.textContent=err[x.dataset.e]||'');
  const bad=Object.keys(err)[0];if(bad){const el=f.querySelector(`[name="${bad}"]`)||f.querySelector('[data-e="'+bad+'"]');if(el)el.focus();return}
  const msg={prenom:o.prenom,nom:o.nom,email:o.email,tel:o.tel||'',ville:o.ville||'',role:o.role,objet:o.objet,chapitre:o.chapitre,page:o.page||'',message:o.message,date:new Date().toISOString()};
  const btn=$('#sendb');btn.disabled=true;$('#fst').textContent='Envoi en cours…';
  try{
    if(FORM_URL){
      const r=await fetch(FORM_URL,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(msg)});
      if(!r.ok)throw new Error('http');
    }else if(dbh&&userNS){
      const id=await userNS.id();if(!id)throw new Error('noid');
      const ref=dbh.doc('feedback/'+id);const snap=await ref.get();
      const prev=snap.exists&&snap.data()&&Array.isArray(snap.data().messages)?snap.data().messages:[];
      await ref.set({email:msg.email,nom:msg.prenom+' '+msg.nom,updated:msg.date,messages:prev.concat([msg]).slice(-20)});
    }else throw new Error('none');
    store.set('draft',{});formState={ok:{hide:true,title:'Message envoyé.',body:`Merci ${esc(o.prenom)}. Votre message a bien été transmis à l’auteur, qui vous répondra à l’adresse ${esc(o.email)}.`},draft:{}};vForm();scrollTo({top:0,behavior:'smooth'});
  }catch(e){
    const body=mailBody(o),subj='Avis sur « La vérité coûte que coûte »';
    formState={ok:{hide:false,title:'Votre message est prêt, mais il n’est pas encore parti.',body:`Ce site ne peut pas l’envoyer seul à cet endroit. Deux façons de le faire arriver :<br><br>1. <button class="btn sm" id="cpm" type="button">Copier le message</button> puis le coller dans un e-mail à <b>${AUTHOR_MAIL}</b>.<br><br>2. <a class="btn sm ghost" href="mailto:${AUTHOR_MAIL}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}">Ouvrir ma messagerie</a> <span class="count">(ne fonctionne pas sur tous les appareils)</span>`},draft:o};
    vForm();$('#cpm')&&($('#cpm').onclick=()=>copy('À : '+AUTHOR_MAIL+'\nObjet : '+subj+'\n\n'+body,'Message copié.'));
    scrollTo({top:0,behavior:'smooth'});
  }
}

/* ---------- boîte de réception (propriétaire) ---------- */
async function vInbox(){
  app.innerHTML=head('Réservé à l’auteur','Messages reçus','Les avis envoyés depuis le formulaire.')+'<div id="inb" class="count">Chargement…</div>';
  if(!dbh||!isOwner){$('#inb').textContent='Cette page n’est visible que par l’auteur.';return}
  let to=setTimeout(()=>{const e=$('#inb');if(e)e.textContent='Le chargement est long. Rechargez la page.'},10000);
  try{
    const snap=await dbh.collection('feedback').get();clearTimeout(to);
    const msgs=[];snap.docs.forEach(d=>{const x=d.data()||{};(x.messages||[]).forEach(m=>msgs.push(m))});
    msgs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    $('#inb').innerHTML=msgs.length?`<p class="count">${msgs.length} message${msgs.length>1?'s':''}.</p>`+msgs.map(m=>`<div class="nitem"><div class="ref"><b>${esc(m.prenom||'')} ${esc(m.nom||'')}</b> · ${new Date(m.date).toLocaleString('fr-FR')} · ${esc(m.objet||'')}</div><p>${esc(m.message||'').replace(/\n/g,'<br>')}</p><div class="ref" style="margin-top:8px">${esc(m.email||'')}${m.tel?' · '+esc(m.tel):''}${m.ville?' · '+esc(m.ville):''} · ${esc(m.role||'')} · ${esc(m.chapitre||'')}${m.page?' · '+esc(m.page):''}</div><div class="acts"><button class="btn sm ghost" data-cp="${esc(m.email||'')}">Copier l’e-mail</button></div></div>`).join(''):'<div class="empty">Aucun message pour le moment.</div>';
    $$('[data-cp]').forEach(b=>b.onclick=()=>copy(b.dataset.cp,'Adresse copiée.'));
  }catch(e){clearTimeout(to);const el=$('#inb');if(el)el.textContent='Impossible de lire les messages pour le moment.'}
}

/* ---------- démarrage ---------- */
const h0=(location.hash||'').slice(1);
view=VIEWS.some(v=>v[0]===h0)?h0:'accueil';
pending={};render();initCaps();
})();
</script>
