<script type="application/json" id="bookdata">{"chapters":[{"num":1,"title":"Ecce ego","sub":"","part":"I","start":3,"end":14,"wip":false,"words":2906,"blocks":[{"t":"h","l":1,"x":"I. LA VÉRITÉ COMME CHEMIN DE LIBERTÉ","p":3},{"t":"q","x":"“Si vous demeurez dans ma parole, vous êtes vraiment mes disciples, vous connaîtrez la vérité, et la vérité vous rendra libres.” Jean 8 : 31-32","p":3},{"t":"p","x":"Depuis toujours, j’ai une attirance particulière pour la vérité. Je la considère comme bonne, juste et nécessaire. Je m’appelle Nelson, j’ai 22 ans, je suis né en Suisse et je vis dans une jolie ville près de Lausanne. J’ai grandi dans une famille athée, dans un climat de grande liberté religieuse. Jamais je n’ai subi la moindre pression pour croire ou ne pas croire, et j’en suis reconnaissant à mes parents. Depuis l’enfance, je ressens une profonde compassion pour les {{p4}} autres, une sensibilité que certains pourraient voir comme une faiblesse. Très tôt déjà, je me demandais comment je pourrais un jour concrétiser cet amour dans ma vie.","p":3},{"t":"h","l":2,"x":"La Rencontre et le Défi Intellectuel","p":4},{"t":"p","x":"J’ai rencontré le Christ à l’âge de 16 ans. Cela a commencé par une discussion inattendue dans la rue avec des amis d’amis. Ils m’ont parlé de leur foi. La conversation fut bienveillante, mais je les jugeais à l’époque comme naïfs, voire insensés. Comment pouvait-on croire à l’existence d’un Dieu ? Mon attitude était orgueilleuse, d’autant plus que j’étais très peu cultivé. Je ne connaissais ni la science, ni la philosophie, ni l’histoire. Je n’avais que mes propres opinions.","p":4},{"t":"p","x":"Pourtant, leur conviction m’a troublé. Même si je ne croyais pas, je voulais rester honnête intellectuellement. Je reconnaissais quand un argument me dépassait. Alors, je me suis lancé un défi : prouver, à eux et à moi-même, que le christianisme était faux. J’ai multiplié les discussions, mené des recherches, exploré les sujets de la science, de la philosophie et de l’histoire. J’ai même accepté d’aller à l’église et de rejoindre un groupe de jeunes croyants. Ce qui m’a marqué chez eux, c’était leur soif de vérité, bien plus que leur désir d’avoir raison. Cela m’a poussé à poser toutes les questions possibles et imaginables, sans détour. Et au fil du temps, j’en suis arrivé à la plus grande découverte de ma vie : Dieu existe, et le christianisme est vrai.","p":4},{"t":"h","l":2,"x":"Le Choc de la Raison face au Cœur","p":4},{"t":"p","x":"Ce choix n’est pas le fruit d’une influence extérieure, contrairement à ce que certains pourraient croire. Pourquoi ? Parce que les arguments qui m’ont conduit jusqu’au seuil de la foi sont {{p5}} avant tout rationnels. La foi elle-même est un don de Dieu : je crois à cause de l’autorité de Dieu qui révèle, et les arguments m’ont montré que cet acte était pleinement raisonnable.","p":4},{"t":"q","x":"Soit j’acceptais cette vérité et je m’y engageais, soit je la rejetais et je vivais dans le déni pour le reste de ma vie.","p":5},{"t":"p","x":"Accepter signifiait un engagement radical qui allait bouleverser mon existence. Je savais que cela déplairait à ma famille, que ce choix ne serait pas bien vu. J’avais conscience que dire « oui » à cette vérité allait m’amener à traverser des épreuves. Je me souviens encore des moments où je cachais ce cheminement à mes parents, de peur de leur réaction. Je cherchais un moyen de leur présenter ma décision de façon rationnelle, qu’ils comprennent que ce n’était pas un choix basé sur l’émotion, mais sur la raison.","p":5},{"t":"h","l":2,"x":"Le Coût de la Vérité : La Réaction Familiale","p":5},{"t":"p","x":"Pourtant, au-delà du regard familial, ce choix a transformé ma vie. Je ne vis plus selon mes désirs personnels ou mes certitudes, mais selon la vérité qui libère. Ce cheminement m’a coûté cher. Certains amis se sont éloignés, ma famille a été surprise et parfois bouleversée. Je revois encore les larmes de ma mère, l’incompréhension de mon père qui me répétait : « Tu t’es fait influencer, tu vas t’éloigner de nous. » Leur réaction m’a profondément attristé.","p":5},{"t":"p","x":"Après avoir annoncé à mes parents que je devenais chrétien, je suis allé pleurer chez mon ami Steve, lui confiant combien {{p6}} la réaction de mes parents m’avait blessé et déstabilisé. Leur réaction m’a semblé disproportionnée, comme si j’avais annoncé un drame. Si j’avais dit que j’avais mis une femme enceinte, j’aurais compris une telle réaction. Mais annoncer que, suite à de longues recherches sur l’existence de Dieu, je suis désormais convaincu ? Une telle démarche devrait être considérée comme réfléchie, même louable. Pourtant, mes parents ont réagi par la peur, sans chercher à comprendre mes arguments.","p":5},{"t":"h","l":2,"x":"La Peur contre la Raison","p":6},{"t":"p","x":"Le contraste avec mon cousin fut frappant. Ma mère lui raconta la nouvelle comme un drame, mais lui en a ri et a dédramatisé :","p":6},{"t":"q","x":"« Il n’y a absolument rien de grave à croire en Dieu. On dirait que tu viens d’annoncer que Nelson avait essayé de la drogue dure ! »","p":6},{"t":"p","x":"Et il avait raison : leur réaction n’était pas à la mesure de ce que je leur annonçais. Bien sûr, je peux comprendre que des parents s’inquiètent pour l’avenir de leurs enfants, mais j’aurais espéré une discussion fondée sur la raison et l’amour plutôt qu’une réaction dictée par la peur. La peur, en effet, étouffe la raison et empêche tout véritable dialogue.","p":6},{"t":"p","x":"Une réaction plus saine aurait été qu’ils m’écoutent, qu’ils questionnent mes arguments et qu’ils jugent de leur solidité. Si mes arguments étaient convaincants, alors ils auraient pu reconnaître la vérité que j’avais découverte. Si, au contraire, mes arguments étaient faibles, ils auraient pu me le démontrer {{p7}} par la raison. Mais refuser d’écouter, se braquer, et se réfugier derrière l’argument d’autorité du type : « J’ai plus d’expérience que toi, donc j’ai raison », ne mène à rien. Cet argument est bancal. Certes, l’expérience donne souvent de la sagesse, mais cela ne signifie pas qu’un aîné ait toujours raison. Même un enfant de 8 ans peut avoir raison face à un adulte, si ses arguments tiennent la route. Ce n’est pas l’âge qui détermine la vérité, mais la raison.","p":6},{"t":"h","l":1,"x":"II. L’ILLUSION DU PLAISIR FACE À L’IMPÉRATIF DE LA VÉRITÉ","p":7},{"t":"p","x":"Ce que j’ai remarqué ce jour-là pour la première fois, c’est que la vérité peut faire peur et que certaines personnes n’en veulent pas. Ce qui est d’ailleurs totalement illogique : pourquoi refuser quelque chose qui est vrai ? N’importe quelle réponse à cette question serait de toute manière irrationnelle, puisque la vérité est rationnelle. Même si cette vérité vous brusque au début, vous commettriez encore une autre erreur en la refusant.","p":7},{"t":"q","x":"« Si tu as raison, alors te remettre en question ne t’engage à rien ; au contraire, tu peux permettre à la personne en face de lui montrer qu’elle se trompe et donc de se corriger. Alors que si tu te trompes, dans le pire des cas, tu auras appris et tu te seras corrigé dans le bon sens. Alors, de quoi avez-vous peur ? »","p":7},{"t":"h","l":2,"x":"L’Enjeu d’une Vie centrée sur Dieu","p":7},{"t":"p","x":"À vrai dire, je ne pense pas qu’il y ait beaucoup de personnes {{p8}} qui comprennent vraiment les enjeux de cette question. Les questions que j’ai reçues à ce sujet témoignent d’un manque de recherche énorme. Une des questions était :","p":7},{"t":"q","x":"« Si Dieu existe, qu’est-ce que ça change ? ».","p":8},{"t":"p","x":"La réponse est simple :","p":8},{"t":"q","x":"Si Dieu existe, alors absolument l’entièreté de ta vie change, car elle n’est plus centrée sur ce que tu veux mais sur ce qui est vrai, et la vérité est Dieu.","p":8},{"t":"p","x":"C’est bien pour cela que certaines personnes ne souhaitent pas suivre Dieu : elles pensent qu’elles perdent une liberté en choisissant Dieu. Mais, de toute manière, si Dieu existe, ne pas le suivre est encore un choix irrationnel puisqu’il est vrai. Décider de ne pas croire en lui malgré les arguments vient souvent moins de la raison que de la volonté. Car, comme l’enseigne saint Thomas d’Aquin, croire est « l’acte d’une intelligence qui adhère à la vérité divine sous l’empire d’une volonté que Dieu meut par sa grâce (Somme théologique, II-II, q. 2, a. 9). La foi est un acte de l’intelligence mû par la volonté, avec le secours de la grâce.","p":8},{"t":"h","l":2,"x":"Le Refus de l’Obligation","p":8},{"t":"p","x":"Malheureusement, aujourd’hui, beaucoup de personnes croient aux énergies et au tarot, etc. Ces pratiques promettent des résultats. L’Église les range parmi les superstitions, qui attribuent à une chose une vertu surnaturelle qu’elle n’a pas. Est-ce que, pour autant, elles sont bonnes ? Absolument pas, {{p9}} car si Dieu existe, il est la source du bien. Sa loi n’est pas un caprice : la loi naturelle est inscrite dans notre raison, et tout homme peut la connaître. Mais les personnes préfèrent choisir quelque chose qui ne leur donne aucune obligation, car elles préfèrent être « libres », elles préfèrent écouter leur cœur, faire ce qu’elles veulent. Enfin, avec cette vision des choses, vous devez donc avouer que vous n’êtes pas quelqu’un de rationnel, mais de purement émotionnel, et que, peu importe si quelque chose est vrai ou non, vous décideriez, quoi qu’il vous en coûte, de faire ce que vous voulez.","p":8},{"t":"p","x":"Depuis de nombreuses années, j’ai développé un problème avec les réponses « vides » ou les réponses toutes faites. J’en ai développé une sorte de dégoût ; j’ai l’impression que ces personnes s’en fichent de dire quelque chose sans aucun sens, sans même essayer de réfléchir.","p":9},{"t":"h","l":1,"x":"III. LE TÉMOIGNAGE : L’EXEMPLE DE RUBEN","p":9},{"t":"p","x":"Pour vous donner un exemple, je vais vous raconter l’histoire d’un ami à moi qui s’appelle Ruben. Mon ami Ruben est un homme qui, assez souvent dans sa vie, a décidé de faire des choix qui le conduisaient vers l’individualisme. Quand je dis cela, c’est pour dire que le but de sa vie était d’être ce qu’il avait envie d’être. Et c’est ce qu’il a fait : il a décidé de s’entourer de personnes qui le conduisaient vers l’alcool, les soirées, etc. Et vous me direz : « Qu’est-ce qu’il y a de mal à vouloir boire un peu d’alcool ou faire des soirées ? » Eh bien, je vous dirais qu’en elles-mêmes ces choses ne sont pas mauvaises d’une manière intrinsèque, mais c’est comment et avec qui, qui peut rendre cela mauvais. Ruben s’est mis dans des soirées où le {{p10}} but même n’était pas de développer une relation avec ses amis, mais plutôt de faire ce que tout le monde avait envie de faire, dans l’excès. Ces soirées ressemblent à un amas de personnes mal dans leur peau qui, au lieu d’apprendre à se connaître, de s’aider dans ce qui ne va pas dans leur vie, de vouloir s’en sortir de leurs problèmes, ils préfèrent oublier tous ces détails et se plonger dans des choses futiles et qui leur font plaisir. A les voir de l’extérieur, on pourrait voir des personnes qui ont tout simplement abandonné de se battre et qui ont tout simplement décidé de se laisser couler dans la tristesse.","p":9},{"t":"p","x":"Le but de ces soirées était des plus malsains : les hommes ne cherchaient qu’à trouver une femme afin de s’en rapprocher pour éventuellement développer une relation avec elle, ou voire même gagner le “gros lot” instantané : pouvoir avoir une relation sexuelle avec elle. Du point de vue des femmes, l’objectif était plus dirigé sur la séduction, sur l’envie de plaire en s’habillant de manière vulgaire, tout en gardant l’envie éventuelle de trouver un homme.","p":10},{"t":"p","x":"En regardant de l’extérieur avec un minimum de lucidité, on dirait tout simplement des animaux en chaleur, obsédés par le plaisir instantané et déstructuré. Et c’est bien tout le but de ces soirées : pas de cadre, pas de limite, juste ton plaisir.","p":10},{"t":"p","x":"Pour les plus jeunes, mais aussi les plus anciens d’entre vous, je pense que vous voyez de quel type de « soirée » je parle. Ayant déjà fait partie de ce monde malheureusement, si je devais le décrire de l’extérieur aujourd’hui, c’est d’une énorme tristesse. Combien de fois ai-je vu des gens complètement bourrés, défoncés à la weed, rigoler, danser, mais qui, dans {{p11}} leur vie de tous les jours, sont profondément tristes, voire même aux portes du suicide. À chaque discussion, je ressentais le mal-être des individus, je ressentais qu’ils essayaient de trouver un réconfort dans quelque chose. Combien de fois ai-je vu des personnes en étant complètement bourrées me parler de leurs problèmes de famille, d’harcèlement, du sentiment de vide, sentir que la vie n’a pas de sens, etc.","p":10},{"t":"p","x":"Dans ce genre de situation, il est extrêmement dur de bien réagir, surtout que d’une certaine manière, il n’est pas étonnant que des personnes deviennent comme ça. On a habitué la population à vivre pour vivre, se faire plaisir pour se faire plaisir, à ne pas faire le mal parce que c’est mal, ou à faire le bien parce que c’est bien. Ces réponses n’expliquent en rien pourquoi on devrait faire tout cela, ou même pourquoi vivre. À quoi bon vivre si c’est pour souffrir et qu’aucun but universel indépendant de nous n’existe ? Si la vie ne servait à rien et que ceci était vrai, alors ces personnes seraient les personnes les plus lucides qui existeraient. Il est totalement logique de penser que la vie ne sert à rien, de le comprendre sincèrement, et du coup de se mettre dans des états comme le leur, plutôt que de le penser et se voiler la face en faisant comme si la vie qu’on vivait n’était pas la vraie vie mais plutôt la vie qu’on aurait souhaitée vivre. Tout individu peut se donner un but aussi futile soit il, mais si ce but disparait, que faites vous?Pour certaines personnes, c’est le travail ; une fois à la retraite elles se sentent parfois perdues et certaines se laissent même dépérir. A quoi bon vivre une vie déterminée uniquement par des buts que l’on se donne à soi-même. La vie n’aurait elle vraiment aucun but suprême ?","p":11},{"t":"h","l":1,"x":"IV. LA FUITE DU RÉEL ET LE POIDS DU SILENCE","p":12},{"t":"p","x":"Ruben a choisi ce monde. Il a choisi de suivre un courant qui lui permet de ne pas faire face à la vérité et qui lui accorde du « repos » durant ces phases de « fête ». Et le problème est bien là : les gens n’apportent plus d’importance à ce qui est vrai et réel, mais préfèrent plutôt le plaisir instantané, l’absence de travail sur soi ou encore le fait de ne pas s’ouvrir à quelqu’un.","p":12},{"t":"p","x":"Ceci montre clairement que quelque chose cloche, mais quoi ? Est-ce que ces gamins sont des personnes à part ? Est-ce que, pour certains, ce style de vie fonctionne ? Les questions ne sont pas celles-ci. La vraie question, c’est : « Est-ce que ce style de vie est bon objectivement pour toi ? »","p":12},{"t":"h","l":2,"x":"La Faiblesse du Silence face au Devoir de Charité :","p":12},{"t":"p","x":"Par une crainte mal placée de heurter la sensibilité d’autrui ou par une lâcheté déguisée en tolérance, nous choisissons trop souvent le silence là où la parole est un impératif. Nous préférons tolérer l’erreur plutôt que de proclamer la vérité, oubliant que la véritable charité ne consiste pas à flatter l’autre dans son égarement, mais à l’en libérer.","p":12},{"t":"h","l":1,"x":"V. ANALYSE PHILOSOPHIQUE : LE NIHILISME ET LE RELATIVISME","p":12},{"t":"p","x":"La vérité n’est pas une chaîne destinée à emprisonner l’intelligence ; elle est, selon la promesse du Christ, ce qui libère l’homme (Veritas liberabit vos). En tout temps et en tout lieu, {{p13}} notre mission est de tracer une frontière nette entre le vrai et le faux, car reculer devant ce devoir, c’est trahir notre propre nature d’êtres doués de raison.","p":12},{"t":"h","l":2,"x":"Le Nihilisme du « Vivre sa Vie » :","p":13},{"t":"p","x":"En désertant cette responsabilité, nous basculons dans une ère de confusion où la distinction entre le bien et le mal s’efface au profit d’un avis personnel poussé à l’extrême. Le but de l’existence ne consiste plus à s’aligner sur ce qui est objectivement juste et universellement bon, mais à s’ériger en législateur de sa propre vie. L’idéal moderne se résume au slogan vide de « vivre sa vie », une quête de plaisir où la vérité est sacrifiée sur l’autel du confort personnel. On ignore alors la loi naturelle pour embrasser un système où rien n’est vrai, et où la seule règle est l’absence de règle.","p":13},{"t":"h","l":1,"x":"VI. CONCLUSION : LA QUÊTE DU SOUVERAIN BIEN","p":13},{"t":"h","l":2,"x":"L’Échec du Relativisme et la Détresse des Âmes :","p":13},{"t":"p","x":"Toutefois, ce rejet de l’ordre moral et de la vérité objective porte des fruits amers. Si la réussite de la vie se mesure uniquement au ressenti individuel et à la satisfaction des désirs, alors que dire de ceux qui sont broyés par l’existence ? En qualifiant la vie de simple aventure personnelle, nous condamnons ceux qui sombrent dans la dépression ou le désespoir du suicide à être perçus comme les victimes d’un « échec de parcours ».","p":13},{"t":"p","x":"C’est là toute l’horreur du système moderne : en privant l’homme d’un sens supérieur et d’une vérité qui le dépasse, il le laisse seul face à son propre vide. La quête du bonheur sans la vérité n’est qu’une course vers l’abîme, car une vie qui ne cherche pas à accomplir son but pour lequel elle a été créée est une vie qui, tôt ou tard, se brise contre le mur de sa propre finitude.","p":14},{"t":"p","x":"Notre monde vit comme si aucune vérité n’existait, mais tout le monde juge comme si une vérité universelle existait. J’espère d’ailleurs de tout mon cœur que mon ami se reconnaîtra en lisant ce livre, car je souhaite profondément qu’il comprenne qu’il n’est plus question de faire ce qui te plaît, mais de faire ce pour quoi tu as été créé.","p":14}]},{"num":2,"title":"Le prix à payer de suivre la vérité","sub":"","part":"I","start":15,"end":30,"wip":false,"words":3304,"blocks":[{"t":"h","l":1,"x":"I. DE L’OMBRE ÉVANGÉLIQUE À LA LUMIÈRE DE LA TRADITION","p":15},{"t":"p","x":"Depuis le début de ma conversion, j’ai enchaîné plusieurs situations où ma foi a été mise à rude épreuve et cela dès le départ et cela n’est pas prêt de s’arrêter. Il me paraît intéressant de vous en raconter certains afin de vous apporter un témoignage réel de ce que ça peut faire de choisir la vérité. Lors de ma conversion à mes 16 ans jusqu’à mes 20 ans je me suis considéré comme un protestant plus précisément évangélique, je côtoyais donc une église évangélique et ma base de ce que je croyais avait été apprise là-bas. Une grande partie de mes amis également étaient là-bas. Cet endroit, cette église, ce groupe de jeunes qui se rassemblait tous les vendredis afin de se retrouver, de discuter ensemble, de manger ensemble, d’assister à des « prédications » sur des thématiques allant de l’apologétique (la défense de la foi par la raison) à des sujets bibliques comme {{p16}} l’analyse de l’histoire de Job. Il faut bien comprendre que tout cela j’y tenais, c’était important pour moi. Autant mes amis, que ce groupe et également les fruits que j’en tirais.","p":15},{"t":"p","x":"Jusqu’au jour où un homme nommé Steve nous a partagé une information troublante qui en a choqué plus d’un. Steve et sa fiancée ont décidé de devenir catholiques. Pour moi je l’ai vu comme un tremblement à la racine même de ma foi, 1000 questions me sont alors venues : Quelles sont les arguments qui l’ont convaincu ? C’est une blague il cherche à nous défier afin qu’on sache mieux débattre. Après cette annonce, l’Église ou plutôt la communauté je devrais dire a eu une réaction très spéciale. Celle de dire à Steve que si l’on venait lui poser des questions il devait nous renvoyer vers eux afin qu’ils puissent également dire ce qu’ils pensent. Et que Steve devrait en tout cas limiter sa venue au groupe de jeunes dans un élan de cohérence avec sa volonté de devenir catholique. Et inconsciemment j’ai comme senti une peur auprès de certaines personnes après cette annonce.","p":16},{"t":"p","x":"Il faut savoir que Steve et sa fiancée Cynthia ont une grande influence auprès des autres. La grande majorité des personnes qui étaient là ont toutes eu beaucoup de discussions avec eux et beaucoup sont devenus chrétiens via leurs discussions avec eux. Nous avons donc évidemment un grand respect envers eux. La réaction des jeunes et donc la mienne a été de vouloir chercher et de comprendre et donc de vouloir volontairement remettre ce qu’on pense vrai en question et vouloir absolument discuter avec Steve et Cynthia. Ce qu’on a d’ailleurs fait. Nous avons également discuté à de multiples soirées avec le « couple pastoral » de notre Église à propos de questions qu’on avait sur {{p17}} le protestantisme. Nous cherchions à réfuter le protestantisme afin d’éviter d’être biaisés. Dans nos questions on pouvait retrouver des questions absolument basiques sur la doctrine protestante, néanmoins la réponse de notre couple pastoral était plus que bizarre à mes yeux.","p":16},{"t":"p","x":"Toutes leurs réponses étaient d’une manière proche ou de loin reliées avec une critique de la foi catholique au point où je leur ai moi-même dit que nous n’étions pas présents pour parler du catholicisme car nous n’étions pas des défenseurs du catholicisme mais tout simplement des chercheurs de vérité peu importe où elle se trouvait. Toute cette noble démarche s’est faite avec une dizaine de jeunes de l’Église avec lesquels on partageait pratiquement tous le même but. La vérité coûte que coûte. Néanmoins, cette démarche plus qu’intellectue llement correcte a été très critiquée. Personnellement j’ai été dénigré sur de nombreuses choses à mon sujet. J’ai été traité de « Suceur de Steve » ou encore plusieurs remarques comme quoi je suis biaisé car Steve a de l’influence et j’ai donc uniquement été influencé par lui et que donc aucun des arguments que je crois ne sont vraiment vrais mais il s’agirait là que d’une illusion. Ces remarques m’ont profondément déçu de ces personnes et m’ont encore une fois prouvé comme je l’ai dit dans mon chapitre Ecce ego que la vérité pouvait faire peur et que des gens n’en voulaient pas car la douleur de la remise en question et du changement était plus dure que de se mentir à soi-même. Sans surprise, les mois passèrent et plus je me renseignais sur le protestantisme plus je devenais incapable de le défendre, plus j’apprenais plus j’avais honte de ce que j’avais osé croire sur certaines thématiques dogmatiques. Il y aura d’ailleurs un chapitre entier à ce sujet sur lequel je {{p18}} retrace une partie des arguments qui m’ont le plus convaincu. Au fil des mois, des livres et des nombreuses recherches, j’ai finalement décidé d’accepter le catholicisme. Ce choix a été pendant longtemps compliqué mais au final m’a plus que fait du bien car j’étais conscient de mes choix et de pourquoi je les faisais. Je ne décidais pas de croire à quelque chose juste pour y croire car ça pourrait me faire du bien, mais je savais exactement pourquoi j’y croyais, j’avais de multiples raisons et arguments pour défendre ma position.","p":17},{"t":"h","l":1,"x":"II. LE REPAS DES GRILLADES : L’AFFRONTEMENT AVEC LE MONDE","p":18},{"t":"p","x":"Un jour en pleine après-midi d’avril, le jour juste après mon baptême, première communion et confirmation, j’étais chez ma famille pour des grillades et un événement choquant s’est produit. Il faut savoir que je n’ai pas pour habitude de parler de ma foi avec ma famille et cela pour plusieurs raisons, premièrement je ne souhaite pas que toutes nos discussions tournent autour de ça et je ne souhaite pas imposer mes visions à quiconque surtout que je sais que certaines vont totalement à l’encontre du point de vue mondain, donc j’ai la pleine conscience que dire mon avis peut choquer, il y a donc une manière à dire et surtout un cadre pour le faire.","p":18},{"t":"p","x":"Deuxièmement, je souhaite que ce genre de thématiques soit demandé par autrui afin que je puisse moi-même déterminer si la personne souhaite sincèrement en parler ou si la personne souhaite uniquement me « taquiner » afin uniquement d’imposer son point de vue sans réel but derrière productif. Durant {{p19}} le repas, mon oncle me posa une question étrange.","p":18},{"t":"q","x":"« Nelson pourquoi crois-tu en la Bible sachant que ce sont des juifs qui l’ont écrite ? ».","p":19},{"t":"p","x":"Ma réaction était plus que perplexe, je ne comprenais déjà de un le but de cette question dans quel but voulait-il savoir ceci ? De deux, connaissant mon oncle je sais pertinemment que cette question est justement dans le but de critiquer et non dans le but d’un réel savoir afin de comprendre ma position. Je lui ai donc répondu :","p":19},{"t":"q","x":"« Quel est le but de ta question ? »","p":19},{"t":"p","x":"De là mon oncle commença à essayer de me mentir en me disant qu’il était sincère et qu’il voulait vraiment comprendre mon point de vue, ce que j’ai d’ailleurs au bout d’un moment décidé de croire en ayant foi qu’il soit assez mature pour ne pas me mentir là-dessus. Quelle fut ma surprise quand juste après lui avoir répondu que ce n’était pas parce qu’on était juif qu’en énonçant une vérité, cette vérité devient obsolète. Sa réaction était déjà dans le jugement non pas en énonçant des faits objectifs comme en énonçant des éventuels problèmes comme le nombre de manuscrits qui existent sur les copies de certains livres de la Bible etc. Non sa réponse était tout simplement de me traiter de débile et de dire que je ne faisais que d’écouter ce que « l’Église Catholique » me disait sans rien remettre en question. J’avais donc bien vu juste dès le départ, et de là démarra une discussion si l’on peut vraiment appeler {{p20}} ça comme ça au milieu de ma famille. Mon oncle continua de dénigrer des aspects chez moi, en énonçant des théories conspirationnistes sans absolument aucune preuve ni même source à l’appui ce qu’il a lui-même avoué d’ailleurs. Plusieurs personnes se sont jointes à cette « discussion », mon cousin, la femme de mon cousin, le frère de la femme de mon oncle. Ils ont commencé à tour de rôle à me poser des questions sur ma foi et sur ce que je croyais et l’une d’entre elles qui fut le déclenchement d’une triste histoire fut :","p":19},{"t":"q","x":"« Nelson, penses-tu avoir raison sur ce que tu crois vis-à-vis des autres ? ».","p":20},{"t":"p","x":"Je ne comprenais pas en quoi cette question fut pertinente pour lui au vu qu’il est absolument irrationnel de décider de croire en quelque chose en changeant une très grande partie de sa vie en se disant consciemment « Je ne sais pas si j’ai raison ». Ma réponse fut donc très simplement :","p":20},{"t":"q","x":"« Si, et seulement si, j’ai raison de croire ce que je crois, alors oui : selon le principe de non-contradiction, tout ce qui contredit ma foi, dans l’islam comme ailleurs, est faux. ».","p":20},{"t":"p","x":"Cette réponse fut le commencement d’un cataclysme au sein de ma famille. Mon cousin se mit à me menacer que j’avais de la chance d’être son cousin car mes propos étaient plus qu’arrogants et que je n’étais personne pour pouvoir affirmer {{p21}} ceci, que je n’étais que « Nelson ». Le frère de la femme à mon oncle frappa sur la table en me demandant pour qui je me prenais, ils commencèrent tous par me dénigrer, me rabaisser et même menacer, au point où très sincèrement au vu de leurs comportements, j’ai même cru que l’un d’entre eux aurait pu en venir aux mains avec moi. À savoir, ma propre mère était présente, elle fut si choquée qu’elle était incapable de dire un seul mot, mon cousin lui posa même la question devant tout le monde si elle n’était pas également choquée de mon propos. Sa réponse me rassura, elle répondit « Non », bien que sa réponse soit juste car en rien mon propos n’est choquant, son non n’est pas un non qui a été donné après analyse de nos points de vue mais bien un « Non » de désintérêt en voulant tout simplement être de mon côté. Ce que j’apprécie mais pour son bien elle devrait être honnête en cas de désaccord, ma foi c’est un détail revenons sur cette « discussion ». Après la réponse de ma mère mon cousin se mit également à faire la morale à ma mère en lui disant que c’est grave ce que je dis et qu’elle devrait également être choquée. Afin de démontrer que cette discussion fut complètement ridicule plusieurs points vont être ressortis.","p":20},{"t":"p","x":"Premièrement, ils m’accusent d’insinuer qu’une vérité objective existe, en disant que « Chacun a sa vérité » ce qui est d’ailleurs impressionnant de leur part car en disant ça ils devraient donc ne pas juger autrui pour ne pas partager les mêmes points de vue, ce qu’ils ne font pas du coup. Inconsciemment ils introduisent une hiérarchie entre les points de vue ou entre « les vérités » comme ils le disent. Ils ne sont absolument pas cohérents avec leurs points de vue, ils insinuent que chacun a sa vérité mais osent me traiter de {{p22}} la sorte car nous ne sommes pas d’accord ? D’une certaine manière j’en retire qu’inconsciemment ils sont d’accord avec moi pour dire qu’il y a une vérité objective. À titre d’exemple et pour montrer donc le non-sens de cette défense, s’ils souhaitaient être cohérents ils devraient donc dire à deux hommes qui se prennent la tête afin de savoir qui a raison sur la couleur du ciel, si l’un dit bleu et l’autre rouge. Alors ils devraient conclure que le ciel est à la fois bleu et à la fois rouge. Dire qu’indépendamment de ce qu’ils pensent ou croient que le ciel est bleu peu importe ce qu’ils pensent cela serait donc une offense selon eux. Voyez dans quelle folie nous sommes, nous sommes dans la tolérance la plus maximale qui existe, on tolère des choses complètement folles dans le but de ne pas brusquer ou blesser quelqu’un. On préfère changer la vérité pour qu’elle soit en adéquation avec ce que l’on croyait déjà. Nous sommes censés adhérer à ce qui est vrai et non adhérer à la vérité à nous.","p":21},{"t":"p","x":"Deuxièmement ils me reprochent de blesser des gens en disant cela, soit c’est vrai que dire ce que je dis peut blesser, comme dire la vérité à un enfant en lui disant qu’il ne devrait pas manger tous les jours des bonbons, l’enfant pourrait être blessé. Est-ce que pour autant nous allons nous conformer à sa volonté ? Absolument pas, je peux être d’accord sur l’emploi de la forme afin d’utiliser des mots appropriés et en étant charitable avec la personne et non dans le but de le détruire en lui exposant qu’il se trompe et qu’il ou elle est stupide. Néanmoins la tolérance n’est pas une solution ni le mensonge, si le ciel est bleu il est bleu et toutes les personnes qui sincèrement décident de croire que le ciel est argenté avec des points roses, la seule chose qu’on devrait dire c’est {{p23}} qu’elles devraient aller consulter un médecin et en urgence. La vérité blesse c’est un fait et je pense que nous avons tous déjà vécu ça, autant vis-à-vis de nous que vis-à-vis de quelqu’un d’autre. Il est toujours plus simple de dire quelque chose que la personne souhaite entendre plutôt que ce qu’elle devrait entendre. La vérité doit être dite lorsqu’on nous demande raison, même si elle doit blesser quelqu’un, car tolérer le mensonge ne fait que blesser la personne indéfiniment, alors que cette « blessure » liée à la vérité est elle-même suivie de son médicament qui est la stabilité dans quelque chose d’indélébile la vérité elle-même. Pour finir cette discussion, après environ 45 min d’acharnement sur moi et indirectement ma propre mère, nous décidons de partir et de rentrer à la maison car c’était trop pour nous.","p":22},{"t":"p","x":"La première chose que j’ai faite après être parti a été de rejoindre mon ami Loïc afin de me confier à lui et de pouvoir enfin pleurer pour libérer tout ce que j’avais contenu. Encore aujourd’hui je ne comprends pas pourquoi avoir dû subir autant d’insultes, de mépris et de menaces à leur égard. Tout le long j’ai été correct, j’ai été calme, je n’ai pas rendu le mal pour le mal mais malgré ça j’ai été traité comme un demeuré qui venait de leur cracher au visage en les insultant. C’était dur, très dur même de vivre ceci au milieu d’eux seul face contre tous. Je me demande :","p":23},{"t":"li","x":"pourquoi « moi » je dois vivre ceci, pourquoi autant ?","p":23},{"t":"li","x":"pourquoi si fort ?","p":23},{"t":"li","x":"Est-ce que je fais quelque chose de mal ?","p":23},{"t":"li","x":"Me suis-je trompé dans ma réponse ?","p":23},{"t":"li","x":"Ai-je été arrogant en étant calme lors de mes réponses ?","p":23},{"t":"p","x":"Encore aujourd’hui je pourrais me poser plusieurs questions, mais je pense que la seule réponse qui répondrait réellement à pourquoi j’ai subi tout ça et ce que je subis encore auprès d’autres personnes, c’est que la vérité est aussi douce que le miel pour ceux qui la cherchent mais est une atrocité pour ceux qui n’en veulent pas. Ce jour-ci je n’ai fait que de dire la vérité et j’ai payé un prix beaucoup trop grand pour ce que j’ai dit. Conséquence, j’ai pleuré pour eux, ma propre mère a pleuré pour moi, mon père s’est pris la tête avec eux tous. La division n’est pas un but, mais elle est parfois le prix de la fidélité à la vérité, comme l’a annoncé notre Seigneur Jésus-Christ lui-même.","p":24},{"t":"q","x":"« Pensez-vous que je sois venu apporter la paix sur la terre ? Non, je vous le dis, mais plutôt la division. Car désormais cinq personnes de la même famille seront divisées : trois contre deux et deux contre trois. Ils se diviseront : le père contre le fils et le fils contre le père, la mère contre la fille et la fille contre la mère, la belle-mère contre la belle-fille et la belle-fille contre la belle-mère. » Saint-Luc 12, 51-53","p":24},{"t":"h","l":2,"x":"Le Témoignage du Disciple : Porter sa Croix avec Allégresse","p":24},{"t":"p","x":"Cette histoire n’est qu’une parmi tant d’autres dans le parcours d’une vie consacrée à la recherche de l’absolu. Est-ce que, pour autant, je regrette d’avoir fait ce choix ? Absolument pas. Est-ce que j’en veux à ma propre famille pour la violence de ses réactions ? Pas le moins du monde. Il s’agit, en réalité, d’une réaction humaine presque normale face à ce qui bouscule les certitudes confortables du monde.","p":24},{"t":"p","x":"Jésus-Christ lui-même a été maltraité pour avoir défendu la vérité. Il n’a jamais agi dans l’insulte, ni dans l’arrogance ; il se tenait uniquement dans l’énonciation des faits et de la volonté divine. Pourtant, il a été insulté, menacé de lapidation, humilié, flagellé, on lui a craché au visage, et il a fini crucifié.Tout cela pour quoi ? Aux yeux de ses bourreaux, pour avoir dit la vérité (Jean 8, 40) ; dans le dessein de Dieu, pour racheter nos péchés. Ce que j’essaie de vous faire comprendre, c’est que si nous défendons une cause d’une telle ampleur le salut des âmes, et si cette cause est juste et vraie, alors peu importe le prix à payer ici-bas.","p":25},{"t":"p","x":"Notre Seigneur a subi ces outrages avant nous, et il nous demande, dans son immense charité, de prier pour ceux qui nous persécutent. Il ne nous appelle pas à médire ou à rendre l’insulte, mais à rester irréprochables jusqu’au bout. Dites la vérité avec charité et douceur, et traitez votre prochain de la même manière que Jésus a traité ses propres bourreaux. Rappelons-nous ses paroles dans les Béatitudes :","p":25},{"t":"q","x":"« Heureux ceux qui sont persécutés pour la justice, car le royaume des Cieux est à eux ! Heureux êtes-vous si l’on vous insulte, si l’on vous persécute et si l’on dit faussement toute sorte de mal contre vous, à cause de moi. Réjouissez-vous, soyez dans l’allégresse, car votre récompense est grande dans les cieux ! » Matthieu 5, 10-12","p":25},{"t":"p","x":"Heureux sommes-nous si nous sommes persécutés pour la justice. Heureux sommes-nous si l’on nous insulte alors que nous ne faisons qu’énoncer ce qui est vrai. Pourquoi devrionsnous être heureux de cela ? Parce que nous recevons l’honneur immense de vivre, à notre humble mesure, le même calvaire que notre Sauveur. Dans ce sermon, il nous donne un espoir éternel, mais il nous prévient également : faire ce qui est juste en ce monde sera lourd de conséquences sociales et humaines à cause de lui.","p":26},{"t":"p","x":"Maintenant, posez-vous sincèrement la question :","p":26},{"t":"q","x":"êtes-vous certains de vouloir la vérité ?","p":26},{"t":"p","x":"Cette vérité peut paraître pesante à porter aux yeux du monde, mais elle est, en réalité, aussi légère qu’une plume pour celui qui a la conscience tranquille. Savoir, dès à présent, que ce que je défendais durant ce repas de famille est vrai me procure une paix profonde. Je sais que ce témoignage n’était pas en vain et que je n’ai commis aucune faute envers qui que ce soit en restant fidèle au réel.","p":26},{"t":"q","x":"Que peut-on reprocher à celui qui demeure charitable tout en protégeant ce qui est vrai ?","p":26},{"t":"p","x":"Si vous choisissez ce chemin, ne soyez pas surpris des tempêtes. Soyez prêts à endurer les pires fardeaux, à nager à contre-courant et à paraître différent de tous les hommes. Soyez prêts à répondre avec douceur et respect à quiconque vous demandera raison de votre espérance. Il ne s’agit pas {{p27}} ici d’une simple vérité technique sur la couleur du ciel, mais d’une vérité aux implications infinies sur l’éternité. C’est là que réside toute l’importance de savoir, une fois pour toutes, si elle est vraie ou fausse. Car une fois trouvée, elle ne vous quittera plus, peu importe le prix.","p":26}]},{"num":3,"title":"Vivre pour le monde","sub":"","part":"II","start":31,"end":44,"wip":false,"words":2806,"blocks":[{"t":"q","x":"« Si vous étiez du monde, le monde aimerait ce qui est à lui ; mais parce que vous n’êtes pas du monde, et que je vous ai choisis du milieu du monde, à cause de cela le monde vous hait. » Jean 15, 19 :","p":31},{"t":"h","l":1,"x":"I. RÉCIT D’UNE DÉCHÉANCE MODERNE : FÊTE MALHEUREUSE EN SON FOND","p":31},{"t":"p","x":"À l’époque, une fête avait été organisée chez un ami à moi, dans les hauts de Lausanne, afin de célébrer son seizième anniversaire ; j’avais moi-même quinze ans à ce moment-là. Nous étions en plein mois de juin : le soleil brillait, il faisait chaud, et tout semblait parfaitement réuni pour célébrer une belle fête. Je marchais en direction de la maison de mon ami et, dès mon arrivée, une première chose me perturba : personne ne m’a salué, mis à part les quelques personnes que {{p32}} je connaissais déjà. Étant de nature timide avec les gens que je ne connais pas au premier abord, je n’osais pas trop aller vers eux pour les saluer de moi-même.","p":31},{"t":"p","x":"La fête venait à peine de commencer, il était environ 14h00, et ce que je voyais était des plus « dérangeants ». Un grand nombre d’adolescents étaient assis sur des chaises, des bancs ou sur des pierres dans le jardin ; la grande majorité d’entre eux restait les yeux fixés sur leurs téléphones, tout en ayant de l’alcool fort à boire. Ce spectacle était accompagné d’une musique grotesque qui mettait bien peu en avant la chasteté ou le respect. Concernant les musiques qui étaient jouées durant la fête, on pourrait presque dire qu’il ne s’agissait pas de musique, mais bien d’un ramassis d’insultes et d’une grande vulgarité. Ce qui m’a d’ailleurs toujours choqué, c’est de voir de nombreuses femmes écouter ce genre de morceaux qui ne les mettent absolument pas en valeur, les traitant comme des objets sexuels, ou des objets tout court, sans qu’elles ne rencontrent le moindre souci à écouter cela. Je ne dis pas qu’il soit normal que les hommes écoutent ceci, mais malheureusement, dans ce type de musique, une écrasante majorité des paroles va à l’encontre de la valeur féminine. De plus, je voyais également plusieurs personnes en train de fumer du cannabis, ou d’autres substances dont je ne saurais décrire la nature encore aujourd’hui.","p":32},{"t":"p","x":"À ce moment-là, j’ai décidé d’essayer de faire comme les autres : je me suis adapté à l’environnement, j’ai trouvé une chaise, je me suis servi un verre et je me suis posé en essayant de m’ennuyer le moins possible. J’ai eu de la chance car un autre ami à moi avait également été invité, et j’ai pu parler {{p33}} avec lui durant un bon moment. La fête avança et des jeux d’alcool commencèrent à s’organiser entre les autres invités de la soirée. N’ayant jamais vraiment été très porté sur l’alcool, j’ai simplement décidé, à cet instant, de regarder. Je ne me rappelle plus exactement du nombre précis de shots de vodka pure qui ont été bu à la chaîne, mais je dirais au minimum quinze ; c’est énorme. Pour donner du contexte et montrer que cela est tout simplement colossal et dangereux : si un homme de 80 kg buvait d’affilée quinze shots de vodka pure, cela représenterait environ 2,8 à 3,4 grammes d’alcool par litre de sang. Sachant que l’on est considéré comme « ivre » dès 1,5 g/l, c’est près du double ; nous sommes ici dans un cas où le coma éthylique est plus que proche.","p":32},{"t":"p","x":"Ce qui devait arriver arriva : plusieurs personnes ont commencé à vomir en plein milieu du jardin, d’autres sur une table, et une autre encore là où les bouteilles étaient stockées, ce qui a sali pratiquement toutes les réserves. Je me souviens d’une femme qui, justement, avait bu tous ces shots ; après qu’elle eut vomi sur la majeure partie des bouteilles, les personnes présentes à la fête ont commencé à l’insulter en lui ordonnant de dégager, multipliant les injures dénigrantes que je ne répéterai pas ici car cela serait fort inapproprié. Après cette « bataille » de « qui a la plus grosse », la soirée continua comme au début, alternant entre boire, fumer et scroller, sans même prendre le temps de partager le gâteau de la personne qui fêtait son anniversaire. La soirée de base est bien un anniversaire, et non pas un concours de qui finira en coma éthylique le premier.","p":33},{"t":"p","x":"Un autre moment m’a marqué durant cette fête : c’est lorsque l’un des invités a surpris un autre convive en train d’avoir une {{p34}} relation sexuelle avec une femme dans la chambre même de la personne qui fêtait son anniversaire. Sans entrer dans les détails, le comportement de ces personnes était totalement animal, car il n’y avait pas qu’une seule relation sexuelle, mais au moins deux avec certitude. Je ne peux être certain qu’il y en ait eu davantage, mais c’est déjà plus que du n’importe quoi. Ayant appris cela sur le moment, je me rappelle avoir été choqué, mais sans plus, car au final je me disais que, tant que c’était consenti, il n’y avait aucun problème à cela.","p":33},{"t":"p","x":"Cette fête a continué dans cette même dynamique en multipliant les personnes ivres et les activités inappropriées. Je me souviens néanmoins d’une discussion que j’avais eue avec un adolescent et qui m’avait tout de même marqué. Pour donner du contexte à ceux qui n’ont jamais assisté à ce genre de soirée ou parlé avec des personnes de ce style, il faut comprendre qu’une personne ayant des soucis dans sa vie, et qui de surcroît est ivre, va beaucoup plus facilement parler de ses problèmes en prenant bien moins de pincettes. Cette personne me parlait de tentative de suicide, de ses parents qui ne le comprenaient pas, de ses études compliquées, de son ex-copine, et de plein d’autres choses de ce genre.","p":34},{"t":"p","x":"Ce que je souhaite partager en racontant cette « fête », et surtout ce qui s’y est déroulé, c’est que les personnes dites « mondaines » ne voient pas de problème absolu à tout cela. Aujourd’hui, peut-être que ces personnes, en regardant ce qu’elles ont fait à l’époque, se diront simplement :","p":34},{"t":"q","x":"« On avait un peu abusé, mais c’était marrant, nous étions jeunes et nous faisions nos expériences de vie. »","p":35},{"t":"p","x":"Il est probable qu’ils donnent ce genre de réponse, mais le problème réside dans le fait de justifier cela par des raisons plus qu’absurdes. De plus, personne ne pointe de manière concrète le problème de boire avec un dosage extrême d’alcool, de n’avoir aucune relation sociale véritable, de fumer des substances plus qu’illégales ou d’avoir des relations sexuelles afin uniquement d’assouvir ses besoins, tels des animaux en chaleur qui ont besoin de rapports sur l’instant. Qui plus est en pratiquant la contraception afin d’être sûr d’éloigner tout sens à l’acte sexuel, pour ne laisser subsister que le plaisir, la sensation et la dopamine que notre corps produit durant l’acte.","p":35},{"t":"p","x":"Ce qui est triste avec cette expérience, c’est qu’elle aurait pu être clairement bénéfique avec un cadre et une bonne morale de vie. J’ai la preuve irréfutable qu’à cette « fête », un grand nombre de personnes avaient de gros, voire de très gros problèmes personnels. Ces personnes ne cherchaient pas à se détendre, mais cherchaient tout simplement à abandonner tout effort compliqué pour tenter de surpasser leurs problèmes. Cela crée, par conséquent, une absence totale de cadre : puisque tout semble « foutu pour foutu », autant aller dans l’excès et pratiquer tout ce que je veux, à partir du moment où cela me plaît. Vous rendez-vous compte de la gravité de cet énoncé ?","p":35},{"t":"q","x":"« Je veux pratiquer ce que je veux à partir du moment où cela me plaît. »","p":35},{"t":"p","x":"Avec de tels énoncés, on peut alors justifier beaucoup de choses condamnables par la loi. Car au final, si des gens veulent réellement défendre ce point de vue, alors ils doivent supprimer toute notion du bien d’autrui. Dire « JE veux car ça ME plaît », et prétendre dans un contexte d’adolescents que ce n’est pas grave, est absolument dangereux. Dire l’inverse reviendrait à affirmer que commettre un acte mauvais ou immoral à cet âge n’est pas condamnable, mais fait simplement partie de la procédure de l’adolescence, en disant qu’il est « normal » de faire des choses comme ça à ce stade de la vie. Et bien non, je vous le garantis, ce genre de choses est très grave. Très tôt, de jeunes adolescents pratiquent la fornication, l’alcoolisme, la drogue, la haine d’autrui et l’anti sociabilité. Ces jeunes-là feront partie de la société un jour ; de plus, je suis certain que toute personne qui viendrait à avoir un enfant présentant ces traits serait d’accord pour dire que c’est malsain et déconseillerait de suivre cette voie.","p":36},{"t":"p","x":"Si, déjà très tôt, les jeunes pratiquent ce genre d’absurdités, il n’est pas étonnant que tant de jeunes connaissent la dépression ou des pensées suicidaires, que le taux de divorce soit si haut, ou que le nombre de personnes ayant déjà essayé la drogue ne fasse que progresser. ayant déjà essayé la drogue ne fasse que progresser. Cette « fête » est le parfait exemple de la manière dont la jeunesse grandit actuellement ; elle montre de manière limpide l’environnement dans lequel ils évoluent et commettent des actes inappropriés. Comme énoncé dans l’histoire de Ruben précédemment, le but de ces « fêtes » devient uniquement un moyen de pratiquer ce qu’on veut, sans aucune règle, juste selon ce que « JE » veux. Ce genre de fêtes, il en existe plein, certaines étant même bien pires.","p":36},{"t":"p","x":"Aujourd’hui, c’est toute une jeune génération qui crie à l’aide sans que personne ne pointe le problème ni ne décide de les aider. Aujourd’hui, on préfère tolérer en mettant la faute sur la « jeunesse », affirmant que cela fait partie des erreurs de parcours. Mais ces erreurs-là ne devraient pas exister du tout ! Une erreur de jeunesse peut être, par exemple, d’avoir fait un mauvais choix d’études parce qu’on n’a pas pris tous les paramètres en compte, ou encore d’avoir une pensée philosophique très utopique car on ne comprend pas encore tout de ses implications. Tout cela constitue des « erreurs de jeunesse » ; le reste de ce que j’ai énoncé relève d’actes graves et très dégradants pour les hommes de manière générale, à tout âge, et plus encore lorsqu’ils sont jeunes.","p":37},{"t":"p","x":"Aujourd’hui, le monde ne voit pas le problème et décide plutôt de le cacher par refus de se remettre en question, ce qui crée une sorte de « mode mondaine » où ce genre d’actes devient « normal » et non plus « problématique ». Aujourd’hui, forniquer n’est pas un souci, boire avec excès n’est pas grave, essayer la drogue si ce n’est que « une fois » n’est pas grave. On commence à tolérer absolument tout ce qu’on n’ose pas désigner comme un problème, par peur de brusquer notre ego et notre jeune génération qui devient de plus en plus compliquée à gérer.","p":37},{"t":"p","x":"Il est temps de penser sincèrement au bien de nos jeunes générations et au bien des Hommes de manière générale, en remettant la morale au centre des choix et en s’y tenant, plutôt que de suivre le principe : « Ce que je veux si j’y prends du plaisir ». Cette expérience que j’ai eue, néanmoins, je ne la regrette pas, car elle me permet de témoigner et de pointer avec {{p38}} précision le problème qui réside au sein des jeunes générations.","p":37},{"t":"h","l":1,"x":"II. VIVRE DANS LE MONDE, FLÉAU OU LIBERTÉ ?","p":38},{"t":"h","l":2,"x":"L’essence du « monde » : Une société d’aveugles","p":38},{"t":"p","x":"Quand je vous parle du « monde », de quoi s’agit-il vraiment ? Le monde, c’est cette société d’aveugles qui veut guider et faire la morale à d’autres aveugles. C’est une société où la règle principale est l’excès et où le mal est camouflé derrière de jolis mots. Vivre selon le monde, c’est suivre des règles qui sont mauvaises au fond d’elles-mêmes en croyant qu’elles sont bonnes. Tel un mouton qui suivrait son berger, sans réfléchir.","p":38},{"t":"p","x":"Platon l’expliquait déjà par l’allégorie de la caverne : des prisonniers tournent le dos à la lumière et ne voient que des ombres bouger sur un mur ; ils « considéreraient que le vrai n’est absolument rien d’autre que l’ensemble des ombres des objets fabriqués (La République, VII, 515c). Et Platon ajoute, à propos de celui qui entreprendrait de les délivrer : « s’ils pouvaient d’une façon ou d’une autre s’emparer de lui et le tuer, ne le tueraient-ils pas ? » (517a). Aujourd’hui, celui qui essaie de dire la vérité est souvent moqué ou rejeté parce qu’il dérange le confort de ceux qui préfèrent rester dans le noir. Le « monde » déteste la lumière car elle montre les taches sur ses vêtements.","p":38},{"t":"q","x":"« La lumière est venue dans le monde, et les hommes ont préféré les ténèbres à la lumière, parce que leurs œuvres étaient mauvaises. Car quiconque fait le mal hait la lumière »","p":38},{"t":"q","x":"(Jean 3, 19-20). »","p":39},{"t":"h","l":2,"x":"Le piège de la « Liberté » et la dopamine","p":39},{"t":"p","x":"Je ne compte plus le nombre de personnes que j’ai vues pratiquer la fornication sans aucun remords, en utilisant un seul mot pour se justifier : la « liberté ». Pour le monde, on est libre de tout : de faire ce qu’on veut de son corps, d’avoir autant de partenaires que l’on veut, de divorcer, d’avorter ou de choisir son sexe même.","p":39},{"t":"p","x":"Mais ce monde est dirigé par une fausse liberté. C’est en réalité une « tolérance abusive ». Cette tolérance ne rend pas les hommes plus heureux ni plus libres. Elle ne fait qu’encourager le mal en disant aux gens :","p":39},{"t":"q","x":"« C’est ok, puisque tu es libre ».","p":39},{"t":"p","x":"En réalité, cette liberté est un esclavage déguisé. On court après la dopamine, après le plaisir immédiat, mais comme le disait saint Augustin : « Tu nous as faits pour toi, Seigneur, et notre cœur est sans repos tant qu’il ne repose en toi ». Le monde essaie de calmer cette soif avec de l’eau salée : plus on en boit, plus on a soif.","p":39},{"t":"h","l":2,"x":"L’aporie : Où s’arrête la liberté ?","p":39},{"t":"p","x":"Certains me diront : « Mais enfin, être libre ne veut pas dire qu’on peut tout faire ! Il y a des limites. » Vous avez raison, il y a des limites. Mais si votre seule règle est la « libertétolérance », alors cette liberté finit par tout justifier. C’est ce {{p40}} qu’on appelle un cercle vicieux. Si un homme vole quelqu’un au nom de sa liberté, vous direz que c’est mal. Mais alors, comment définissez-vous votre limite si, au final, chacun est son propre petit dieu ?","p":39},{"t":"p","x":"Le psychiatre Viktor Frankl, rescapé d’Auschwitz, disait :","p":40},{"t":"q","x":"La liberté risque de dégénérer en simple arbitraire si elle n’est pas vécue de façon responsable”","p":40},{"t":"p","x":"Si la liberté n’est pas reliée à une vérité plus grande que nous, elle devient juste une excuse pour faire n’importe quoi. C’est pour cela que les limites du « monde » changent tout le temps : ce qui était choquant hier est normal aujourd’hui, et ce qui est normal aujourd’hui sera peut-être obligatoire demain.","p":40},{"t":"h","l":2,"x":"Nous ne sommes pas nos propres créateurs","p":40},{"t":"p","x":"L’histoire de notre société montre qu’avec le temps, des actes autrefois jugés moralement inacceptables sont devenus “normaux” au nom de la liberté. Ce mot sert aujourd’hui de bouclier pour transformer le mal en un droit. Par exemple, l’avortement était autrefois considéré comme un acte intrinsèquement mauvais, sans discussion possible, que l’on invoque la liberté ou non. Aujourd’hui, cette même liberté est utilisée pour effacer le caractère sacré de la vie et rendre banale une chose qui ne l’est pas.","p":40},{"t":"p","x":"Si on parle de vraie liberté, on doit parler de ce qui nous appartient vraiment. Or, personne n’a créé son propre corps. Nous n’avons pas choisi de naître, ni la couleur de nos yeux, ni {{p41}} le fonctionnement de nos organes. Si nous ne sommes pas nos propres créateurs, nous n’en sommes pas les maîtres absolus.","p":40},{"t":"p","x":"Le Psalmiste écrivait dans les Psaumes :","p":41},{"t":"q","x":"« Tes mains m’ont créé, elles m’ont formé ; donnemoi l’intelligence, pour que j’apprenne tes commandements ! » Psaume 119, 73.","p":41},{"t":"p","x":"Nous sommes un peu comme des locataires dans une maison : nous avons la liberté de bien l’entretenir ou de tout casser, mais la maison ne nous appartient pas. Sans les règles du Propriétaire (Dieu), la liberté du monde est un fléau. C’est la porte ouverte à tous les abus. Comme le résume une formule tirée des Frères Karamazov de Dostoïevski :","p":41},{"t":"q","x":"« Si Dieu n’existe pas, tout est permis ».","p":41},{"t":"p","x":"Sans Dieu, le bien et le mal deviennent juste des opinions, et l’opinion du plus fort finit toujours par écraser celle du plus faible.","p":41}]},{"num":4,"title":"Le relativisme","sub":"","part":"III","start":45,"end":58,"wip":false,"words":2886,"blocks":[{"t":"q","x":"« La vérité n’est ni à moi, ni à toi, pour qu’elle puisse être et à toi et à moi. » Saint Augustin, Les Confessions.","p":45},{"t":"h","l":1,"x":"I. INTRODUCTION : LA MÉTAPHORE DU PHARE","p":45},{"t":"p","x":"L’histoire de la pensée occidentale est souvent comparée à la construction d’un phare : un édifice solide censé éclairer tout le monde de la même manière. Cette lumière, c’est la Vérité absolue. Pourtant, dès l’Antiquité, des penseurs ont suggéré que nous ne portons pas tous les mêmes lunettes et que, par conséquent, la lumière du phare change selon celui qui la regarde. C’est le cœur du relativisme.","p":45},{"t":"h","l":1,"x":"II. L’ÈRE DES SOPHISTES : L’ART DE CONVAINCRE","p":46},{"t":"p","x":"Tout commence au Ve siècle avant J.-C. à Athènes. À cette époque, des professeurs de rhétorique appelés les Sophistes font sensation. Contrairement à Socrate, qui enseignait gratuitement dans les rues, les Sophistes (du grec sophistès, signifiant « spécialiste du savoir ») étaient des enseignants étrangers qui voyageaient de ville en ville. Leur méthode : Ils proposaient des leçons de rhétorique, d’éloquence et de politique contre des salaires très élevés. Ils ne cherchaient pas la « Vérité » avec un grand V, mais l’efficacité du discours. L’outil principal : Un Sophiste se devait de maîtriser à la perfection l’art de la contradiction. Leur outil de prédilection était l’antilogie : la capacité de soutenir, avec une force égale, deux thèses totalement opposées sur un même sujet.","p":46},{"t":"p","x":"Vulgarisation : Pour un Sophiste, un bon avocat est celui qui est capable de prouver que l’accusé est coupable le lundi, et de prouver qu’il est innocent le mardi, avec les mêmes preuves. Ce n’est pas le “vrai” qui compte, c’est la capacité à convaincre l’auditoire.","p":46},{"t":"h","l":2,"x":"Du “Physis” au “Nomos”","p":46},{"t":"p","x":"Ce qui est intéressant, c’est que les Sophistes ont instauré un nouveau courant de pensée. Avant eux, les philosophes étudiaient la « Physis » (la nature, les lois de l’univers). Les Sophistes, eux, s’intéressent au « Nomos » (la loi humaine, la convention).","p":46},{"t":"p","x":"Leur raisonnement est le suivant : puisque les lois changent d’une cité à l’autre (par exemple, à Athènes on ne vote pas comme à Sparte), cela prouve que la justice n’est pas une loi de la nature, mais une simple invention humaine qui dépend du contexte.","p":47},{"t":"h","l":2,"x":"La mauvaise réputation","p":47},{"t":"p","x":"Au fil du temps, ils ont acquis une mauvaise réputation. Le terme « sophisme » désigne aujourd’hui un raisonnement faux avec une apparence de vérité, principalement à cause de Platon et Aristote. Ces derniers les considéraient comme des marchands de savoir dangereux : Platon définit le sophiste comme « un chasseur intéressé de jeunes gens riches », « un négociant en connaissances à l’usage de l’âme » (Le Sophiste, 231d). qui détruisaient l’idée même de vérité au profit du pouvoir personnel. Le sophisme marque la naissance non pas d’une volonté de chercher la vérité, mais de celle de briller et de gagner dans les débats de la démocratie naissante.","p":47},{"t":"h","l":1,"x":"III. PROTAGORAS ET L’HOMME-MESURE","p":47},{"t":"p","x":"Le plus célèbre des Sophistes est sans doute Protagoras. Il lance une idée révolutionnaire :","p":47},{"t":"q","x":"« L’homme est la mesure de toutes choses. »","p":47},{"t":"p","x":"Protagoras visait d’abord la perception : chaque chose est pour moi telle qu’elle m’apparaît. Aristote en a tiré la conséquence : cela revient à dire que ce qui paraît à chacun est la réalité même. Cela posé, il en résulte que la même chose est et n’est pas, est à la fois bonne et mauvaise » (Métaphysique, K, 6, 1062b). Ses héritiers en ont tiré une conséquence redoutable : si la vérité dépend de chacun, celui qui parle le mieux l’emporte.","p":48},{"t":"h","l":1,"x":"IV. La Réaction Chrétienne : L’Unique Lumière","p":48},{"t":"p","x":"Comme le souligne la citation de Saint Augustin, l’Église catholique a fermement combattu cette idée. Pour les Pères de l’Église, la vérité est comme le Soleil : elle est là indépendamment de nous, unique, et même si on ne la voit pas, c’est qu’on ne souhaite pas la voir.","p":48},{"t":"p","x":"À l’arrivée du christianisme le relativisme recule fortement, sans disparaître : l’évêque de Paris condamne encore en 1277 la thèse dite de la “double vérité”.","p":48},{"t":"h","l":1,"x":"V. La Renaissance et le Choc de l’Autre","p":48},{"t":"p","x":"Au XVIe siècle, tout bascule. On découvre de nouveaux continents et de nouveaux peuples. Michel de Montaigne, en observant les coutumes des indigènes d’Amérique, réalise une chose simple : ce que nous trouvons “normal” ici est “choquant” ailleurs, et inversement. Comme l’écrit Montaigne (Essais, I, 31, Des cannibales) :","p":48},{"t":"q","x":"« Chacun appelle barbarie ce qui n’est pas de son usage. »","p":49},{"t":"h","l":1,"x":"VI. Nietzsche : La Mort de l’Objectivité","p":49},{"t":"p","x":"À la fin du XIXe siècle, Friedrich Nietzsche parachève cette évolution. Il affirme qu’il n’existe aucun « œil de Dieu » capable de voir le monde tel qu’il est vraiment. Nous sommes tous coincés derrière notre propre point de vue.","p":49},{"t":"li","x":"Le Perspectivisme : Nietzsche amène l’idée que le concept de vérité universelle ne peut pas exister car nous sommes tous victimes de notre propre ressenti, de nos biais culturels et de nos points de vue.","p":49},{"t":"li","x":"L’impossibilité de l’objectif : Chercher une vérité objective pour tous est, selon lui, non seulement impossible mais conceptuellement faux. Il ne conçoit pas de vérité universelle ; chacun, en fonction de son vécu et de sa culture, sera amené à croire à différentes choses, à avoir une sensibilité différente pour certains sujets.","p":49},{"t":"p","x":"La différence entre les hommes est, pour lui, la preuve qu’une singularité au sujet de la vérité est tout bonnement inexistante.","p":49},{"t":"q","x":"« Il n’y a pas de faits, seulement des interprétations. » Friedrich Nietzsche, Fragments posthumes.","p":50},{"t":"p","x":"Dans Par-delà le bien et le mal, il l’affirme ouvertement :","p":50},{"t":"q","x":"« nulle vie ne peut subsister qu’à la faveur d’estimations et d’apparences inhérentes à sa perspective » Friedrich Nietzsche, Par-delà le bien et le mal","p":50},{"t":"h","l":2,"x":"De la remise en question à la norme sociale","p":50},{"t":"p","x":"Le passage de la pensée de Nietzsche à notre société actuelle ne s’est pas fait en un jour. Il a fallu que le doute philosophique, autrefois réservé à une élite intellectuelle, devienne le logiciel de base de l’individu moderne. Le lien direct entre l’histoire et aujourd’hui réside dans une transformation radicale : le relativisme n’est plus seulement une théorie sur la connaissance, il est devenu une exigence éthique.","p":50},{"t":"p","x":"Si les Sophistes utilisaient le relativisme pour gagner des débats, et si Montaigne l’utilisait pour prôner la tolérance, l’homme moderne l’utilise pour protéger son identité. Aujourd’hui, le relativisme est utilisé à tort et à travers ; les personnes ne savent même plus ce qu’est le relativisme, ni même que leur propre pensée est relativiste. Penser de cette manière amène un certain confort : imaginez que l’on puisse ne jamais avoir tort, ne jamais devoir s’améliorer, ne jamais devoir faire quelque chose que nous ne trouvons pas “bien”.","p":50},{"t":"p","x":"C’est précisément pour ces raisons que de très nombreuses personnes utilisent aujourd’hui le relativisme comme morale de vie.","p":51},{"t":"p","x":"De la même manière que les Sophistes ne voulaient pas perdre de débat, les hommes actuels ne veulent pas perdre leur confort en avouant devoir changer pour un plus grand bien.","p":51},{"t":"h","l":2,"x":"Le passage du “Vrai” au “Ressenti”","p":51},{"t":"p","x":"Le lien le plus solide entre le relativisme historique et le nôtre est le détrônement de l’objectivité.","p":51},{"t":"h","l":2,"x":"L’héritage de Protagoras","p":51},{"t":"p","x":"Aujourd’hui, nous vivons le triomphe de l’adage : « L’homme est la mesure de toutes choses ». Dans nos débats actuels, le ressenti personnel a acquis une valeur supérieure à la preuve scientifique ou aux faits historiques. On ne cherche plus à avoir raison, mais à se cacher derrière une « pseudo-vérité » qui nous permet de vivre la vie comme on le souhaite. L’émotionnel prime sur le rationnel… C’est un constat bien triste et pathétique.","p":51},{"t":"h","l":2,"x":"La mort du Logos","p":51},{"t":"p","x":"Là où Saint Augustin voyait une vérité universelle qui nous rassemble, le relativisme moderne voit une vérité qui nous sépare. On ne dit plus « C’est vrai », on dit « C’est ma vérité ». Ce glissement sémantique est le cœur du problème : la vérité est devenue une propriété privée.","p":51},{"t":"p","x":"La conséquence majeure de cette séparation est la fin totale de la discussion et de l’échange. Si, au final, la vérité est propre {{p52}} à chacun, alors toutes nos discussions ne sont que des sons parmi tant d’autres, sans valeur. « Pensez ce que vous voulez et soyez heureux » : c’est bien par des pensées comme celle-ci que des horreurs humaines ont débuté.","p":51},{"t":"h","l":2,"x":"Le Relativisme Culturel : De l’ouverture d’esprit au dogme de l’équivalence","p":52},{"t":"p","x":"En suivant la lignée de Montaigne, notre époque a transformé l’observation « les cultures sont différentes » en un dogme : « toutes les cultures se valent et aucune ne peut être jugée ». C’est ici que le relativisme devient un outil politique qui interdit de critiquer des pratiques lointaines au nom du respect de la différence.","p":52},{"t":"h","l":2,"x":"L’héritage détourné de Montaigne","p":52},{"t":"p","x":"Pour Montaigne, le relativisme était un outil de lucidité. En affirmant que « chacun appelle barbarie ce qui n’est pas de son usage », il voulait nous apprendre à ne pas être arrogants et nous montrer que nos propres lois n’étaient pas les seules valables. Cependant, la société contemporaine a transformé cela en un multiculturalisme absolu.","p":52},{"t":"li","x":"Le principe : Aucune norme morale ne peut prétendre être supérieure à une autre.","p":52},{"t":"li","x":"La conséquence : Si une pratique nous semble choquante (droits des femmes, liberté d’expression), le relativisme nous impose de nous taire car « c’est leur culture ». Établir une échelle de valeur morale devient impossible.","p":52},{"t":"h","l":2,"x":"Le lien avec l’Anthropologie : Le passage à la science","p":52},{"t":"p","x":"Au XXe siècle, ce lien s’est solidifié grâce au relativisme {{p53}} méthodologique (Boas, Lévi-Strauss) :","p":52},{"t":"li","x":"L’observation participante : On ne juge plus les coutumes comme « arriérées » ; on cherche leur fonction interne.","p":53},{"t":"li","x":"La fin de l’échelle de civilisation : Il n’y a plus de « sauvages », seulement des réponses différentes à des problèmes universels.","p":53},{"t":"li","x":"Le danger du “Tout se vaut” : Si cette approche est nécessaire à la science, son transfert dans la morale quotidienne pose un défi. Dire que « tout se vaut » permet de mettre fin à toute question et de s’enfermer dans ses propres croyances sans plus jamais les développer.","p":53},{"t":"h","l":2,"x":"Le lien avec la technologie : Le Perspectivisme numérique","p":53},{"t":"p","x":"Le lien avec Nietzsche est prophétique. Les algorithmes ont rendu sa célèbre sentence techniquement réelle :","p":53},{"t":"q","x":"« Il n’y a pas de faits, seulement des interprétations. »","p":53},{"t":"h","l":2,"x":"Les Bulles de Filtre : Le triomphe de l’angle mort","p":53},{"t":"p","x":"Les réseaux sociaux créent des mondes clos où la vérité est faite « sur mesure » pour flatter l’individu. La contradiction disparaît au profit d’un miroir déformant.","p":53},{"t":"li","x":"Témoignage personnel : Il m’est moi-même arrivé de tomber sur du contenu qui pensait comme moi. Je développais une forme de validation, un confort, voire de l’orgueil en me disant que moi j’avais raison et les autres tort.","p":53},{"t":"li","x":"Constat : Nous ne sommes plus dans une société de recherche du vrai, mais dans la recherche de ne pas brusquer,","p":53},{"t":"q","x":"proposant à l’individu exactement ce qu’il veut, même si cela est faux ou malsain.","p":54},{"t":"h","l":2,"x":"La fragmentation de la vérité commune","p":54},{"t":"p","x":"Nous ne partageons plus une source commune (la source d’eau publique d’Augustin), mais des milliards de mondes isolés.","p":54},{"t":"li","x":"Le rappel d’Augustin : La vérité appartient à tout le monde car elle n’appartient à personne en particulier. Privée, elle devient un mensonge.","p":54},{"t":"li","x":"L’ère numérique : Elle matérialise le triomphe de la propriété privée sur le savoir. La vérité est devenue un contenu jugé sur sa viralité. Nous sommes passés d’une vérité qui rassemble à une vérité qui divise.","p":54},{"t":"h","l":1,"x":"V. Synthèse : Le paradoxe du relativisme (Point de vue Catholique)","p":54},{"t":"p","x":"D’un point de vue catholique, ce lien est une tragédie spirituelle. En voulant libérer l’homme, le relativisme l’a coupé du Logos, le Verbe de Dieu, qui est la Vérité en personne.","p":54},{"t":"h","l":2,"x":"La “Dictature du Relativisme” : De la liberté à l’esclavage","p":54},{"t":"p","x":"La liberté catholique est l’adhésion au vrai. En se voulant « mesure de toutes choses », l’homme s’enferme dans son ego. Ce que le monde appelle « libération », l’Église le voit comme un isolement. Sans vérité commune, l’homme erre dans la solitude de son orgueil, séparé de ses semblables.","p":54},{"t":"h","l":2,"x":"Le retour au Soleil d’Augustin : La Vérité qui libère","p":54},{"t":"p","x":"La Vérité n’est pas une idée abstraite, c’est une Personne (le {{p55}} Christ). Elle est un don de Dieu destiné à tous. Le relativisme mène au nihilisme (rien n’est vrai). Comme le disait le cardinal Joseph Ratzinger, la veille de son élection au pontificat, c’est une « dictature » car elle ne reconnaît rien comme définitif et laisse pour seule mesure les désirs de l’ego.","p":54},{"t":"h","l":2,"x":"L’impossibilité de la Charité","p":55},{"t":"p","x":"Sans vérité, la Charité (l’amour chrétien) est impossible. L’amour sans vérité dégénère en sentimentalisme ou en indifférence. Le « vivre-ensemble » s’effondre si nous remplaçons la volonté de Dieu par la volonté de puissance individuelle.","p":55},{"t":"h","l":1,"x":"VI. VEREDICTUM","p":55},{"t":"q","x":"« La vérité vous rendra libres » Jean 8 :32","p":55},{"t":"p","x":"Au terme de cette généalogie, un constat s’impose avec la force de l’évidence : le relativisme n’est pas une libération, mais un suicide intellectuel et spirituel. Ce qui a débuté à Athènes comme une prouesse de rhétorique avec les Sophistes s’achève aujourd’hui dans le chaos numérique, prouvant que l’homme ne peut être la “mesure de toutes choses” sans se condamner à l’insignifiance.","p":55},{"t":"h","l":2,"x":"L’impossibilité logique : Le cercle vicieux","p":55},{"t":"p","x":"Le premier acte de décès du relativisme est sa propre contradiction {{p56}} interne. Affirmer que « tout est relatif » est une proposition qui se veut absolue. Si aucune vérité n’existe, alors cette phrase elle-même est fausse. Le relativisme est une pensée qui se dévore elle-même : il réclame la tolérance au nom d’une absence de règles, mais finit par imposer sa propre dictature du vide. Comme nous l’avons vu, il ne crée pas de dialogue ; il le tue en rendant le mot même de « raison » obsolète.","p":55},{"t":"h","l":2,"x":"L’impossibilité sociale : La tour de Babel numérique","p":56},{"t":"p","x":"L’analyse de notre modernité, marquée par le perspectivisme numérique de Nietzsche et l’héritage détourné de Montaigne, démontre que le relativisme est socialement invivable.","p":56},{"t":"li","x":"Une société de solitudes : Une communauté humaine ne peut survivre sans un socle de vérités immuables. Le relativisme a transformé le débat public en une juxtaposition de cris émotionnels où le « ressenti » fait loi.","p":56},{"t":"li","x":"L’effondrement du bien commun : Si la vérité est une propriété privée, alors la justice n’est plus qu’un rapport de force. Sans le Logos cher à Saint Augustin, nous ne construisons plus une cité, mais une tour de Babel où chacun parle sa propre langue, enfermé dans sa bulle algorithmique.","p":56},{"t":"h","l":2,"x":"L’impossibilité spirituelle : La tragédie de l’orgueil","p":56},{"t":"q","x":"D’un point de vue catholique, le relativisme est l’expression ultime du péché d’orgueil. En refusant de reconnaître une Vérité qui lui préexiste, l’homme se prend pour Dieu. Mais ce dieu est un souverain mi-sérable, {{p57}} régnant uniquement sur lui-même…, régnant sur un royaume de doutes et de désirs éphémères.","p":56},{"t":"li","x":"L’esclavage du moi : En rejetant le dogme comme une prison, l’homme a trouvé une geôle bien plus étroite : celle de son propre ego.","p":57},{"t":"li","x":"Le vide de la Charité : Sans la Vérité, l’amour (la Caritas) meurt. On ne peut aimer véritablement son prochain si l’on ne reconnaît pas en lui une dignité objective et universelle. Le relativisme n’offre que l’indifférence déguisée en respect.","p":57},{"t":"p","x":"Le relativisme est impossible car il nie la structure même de la réalité. On ne peut vivre durablement dans le mensonge d’une vérité “à la carte”. La crise de sens que traverse notre époque est le symptôme de cette déconnexion radicale avec le Réel et le Divin. Il est temps de quitter les ombres mouvantes de la caverne sophiste pour revenir à la clarté du Soleil augustinien. La vérité n’est pas une chaîne, elle est l’unique boussole qui permet à l’homme de ne pas sombrer dans le nihilisme. Seule la reconnaissance d’une Vérité absolue, transcendante et partagée pourra restaurer la dignité de l’intelligence humaine et la possibilité d’une authentique fraternité. Pour ceux qui décideront, malgré tout cela, de persister dans une position relativiste, vous avez au moins désormais conscience que votre pensée est non seulement impossible, mais d’une inanité totale.","p":57},{"t":"h","l":2,"x":"Le choix de la vacuité","p":57},{"t":"p","x":"Vous choisissez délibérément de vivre dans une réalité pauvre et complètement vide de sens. Pourquoi souhaiter l’exil dans un monde où rien n’est défini ? Pourquoi vivre pour accomplir des actes qui sont eux-mêmes dépourvus de toute valeur intrinsèque ? J’ai envie d’avoir foi en vous qui me lisez, en me disant que la seule explication à cet entêtement réside dans le confort. Vous avez peur. Peur de changer, peur de remettre en question une expérience et des certitudes qui vous ont accompagnés toute votre vie. Ce sentiment est, en un sens, justifié : la recherche de la Vérité est un acte exigeant, un combat de longue haleine qui demande du temps et du courage.","p":58},{"t":"h","l":2,"x":"Le moment du choix","p":58},{"t":"p","x":"Mais désormais, un choix radical s’impose à vous :","p":58},{"t":"li","x":"Souhaitez-vous continuer à vivre dans le déni, au cœur d’un rêve qui s’apparente à un cauchemar ?","p":58},{"t":"li","x":"Ou souhaitez-vous enfin prendre votre vie en main en vous posant les bonnes questions, en comprenant qu’une réalité bien plus vaste et lumineuse vous attend ?","p":58},{"t":"p","x":"J’espère sincèrement que, si ce n’est pas encore le cas, la lecture de cet ouvrage aura agi comme un déclic. Que d’ici la dernière page, votre décision sera prise : celle de renoncer au vide pour embrasser ce qui est véritablement.","p":58}]},{"num":5,"title":"Philosophie avec ou sans Dieu ?","sub":"","part":"III","start":59,"end":74,"wip":false,"words":3750,"blocks":[{"t":"p","x":"La philosophie vient du grec philo (amour) et sophia (sagesse) : c’est littéralement « l’amour de la sagesse ». Elle peut être définie comme l’art de penser par soi-même et d’interroger en profondeur les grandes questions de l’existence. Le principe même de la philosophie est donc de créer, développer et approfondir des questions, dans le but de trouver des vérités. Prenons un exemple simple et universel : la moralité. C’est une thématique centrale, largement discutée par les philosophes et par chacun d’entre nous dans la vie quotidienne. Or, si l’on affirme qu’il n’existe pas de vérité, que tout est purement subjectif, alors ce débat devient vain. Si la philosophie refuse de remonter jusqu’à Dieu, source de toute vérité, elle se prive de son fondement ultime et finit par s’effondrer. Voici pourquoi.","p":59},{"t":"h","l":1,"x":"I. L’INSUFFISANCE DE L’IMMANENCE : L’EFFONDREMENT DE LA PENSÉE CLOSE","p":60},{"t":"p","x":"La philosophie commence par une question simple : « Qu’est-ce qui est vrai ? » Mais pour répondre à cette question, il faut d’abord savoir si notre outil pour chercher la vérité, notre raison, est fiable. Imaginez que vous essayiez de mesurer la longueur d’une table avec une règle qui change de taille tout le temps. Vous n’arriveriez jamais à un résultat correct. Sans Dieu, notre raison est un peu comme cette règle cassée. Si l’on retire Dieu de l’équation, l’être humain n’est que le résultat d’une longue suite de hasards biologiques. Nos pensées seraient alors provoquées par des réactions chimiques dans nos neurones, un peu comme une canette de soda qui pétille quand on la secoue. Si c’est le cas, une pensée n’est ni vraie ni fausse, elle est juste une réaction physique. C’est ici que la philosophie sans Dieu s’effondre. Si mes pensées ne sont que de la chimie, pourquoi devrais-je croire qu’elles me disent la vérité sur le monde ? Un ordinateur ne « sait » pas qu’il fait des calculs, il suit juste des circuits électriques. Sans une âme créée par Dieu et une Intelligence supérieure qui a organisé l’univers, nous ne sommes que des machines biologiques. Mais une machine ne peut pas faire de la philosophie. Chesterton l’avait vu : « si l’esprit n’est qu’une machine, de quel intérêt est la pensée ? » Et il ajoutait : « Il est une pensée qui arrête la pensée. C’est la seule que l’on devrait arrêter Blaise Pascal soulignait cette fragilité dans ses Pensées :","p":60},{"t":"q","x":"« L’homme n’est qu’un roseau, le plus faible de la nature ; mais c’est un roseau pensant »","p":60},{"t":"q","x":"Pensées de Blaise Pascal","p":61},{"t":"p","x":"Cependant, sans Dieu, ce roseau n’a aucune racine pour soutenir sa pensée. Pour chercher la vérité, il faut être libre et capable de voir au-delà de la matière. Ce n’est pas notre croyance en Dieu qui rend notre raison fiable : c’est parce qu’elle a été créée par une Intelligence qu’elle est faite pour le vrai. Un athée peut donc raisonner juste ; mais sa philosophie ne peut plus expliquer pourquoi ses pensées seraient autre chose que des illusions utiles à la survie","p":61},{"t":"p","x":"Quand on enlève Dieu, la vérité devient comme le temps qu’il fait : elle change selon l’endroit où l’on se trouve. C’est ce qu’on appelle le relativisme. Vous avez sûrement déjà entendu : « C’est ta vérité, moi j’ai la mienne. » À première vue, cela semble respectueux, mais en réalité, c’est la mort de la pensée. Le cardinal Joseph Ratzinger, futur Benoît XVI, dénonçait d’ailleurs ce danger :","p":61},{"t":"q","x":"« On est en train de mettre sur pied une dictature du relativisme qui ne reconnaît rien comme définitif et qui donne comme mesure ultime uniquement son propre ego et ses désirs »","p":61},{"t":"p","x":"Si tout est relatif, alors plus rien n’est vrai. Si je dis que la Terre est ronde et que vous dites qu’elle est plate, et qu’on conclut que « chacun a sa vérité », alors la vérité n’existe plus. Le débat devient inutile. Pourquoi discuter si personne n’a raison ? La philosophie devient alors un simple passe-temps, comme de parler de ses goûts en cuisine. Mais la philosophie est censée {{p62}} être une quête sérieuse. La vérité est une rencontre entre notre esprit et la réalité. Mais pour que cette rencontre soit possible, il faut que le monde ait été créé avec un sens précis. Sans Dieu, le monde est comme un livre écrit par un singe qui tape au hasard sur un clavier : on peut y voir des mots par chance, mais il n’y a pas d’histoire, pas de message, pas de vérité à découvrir.","p":61},{"t":"p","x":"La science est un outil formidable pour expliquer le fonctionnement des choses : elle peut vous dire comment l’eau bout à 100°C ou comment les cellules se divisent. Mais elle est totalement muette dès qu’on lui demande s’il est bien ou mal d’utiliser cette science pour faire souffrir quelqu’un. Elle explique le mécanisme, mais jamais le sens. Albert Einstein, qui croyait au Dieu de Spinoza et non à un Dieu personnel, disait :","p":62},{"t":"q","x":"« La science sans la religion est boiteuse, la religion sans la science est aveugle. »","p":62},{"t":"p","x":"Sans Dieu, l’univers n’a pas de but. Il est juste là. La philosophie essaie de trouver une direction à nos vies, mais si le point de départ et le point d’arrivée sont le néant, alors tous les chemins se valent. C’est pour cela que la philosophie sans Dieu finit souvent par dire que rien n’a d’importance. C’est ici que la logique pure intervient. Le philosophe antique Parmén
